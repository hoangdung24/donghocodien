0_tt6&_nc_cat=105&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=LNbJEBhRPNQQ7kNvwH1aJpA&_nc_oc=AdoVlLr7aP29dKjOrEa9ftIr1YqivKFpW-3lyb3LQqgghWps0C3BkHojJjl4oplZvDY&_nc_zt=23&_nc_ht=scontent-sin11-1.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQRlwz71EfnuimOCKCS6sQG2YRA7aMG2_wjAgoCQge2mmA&oe=6AF49489","seo_canonical_url":null,"caption":{"pk":"18000929502039997","text":"The silver dial on this Oyster Perpetual ref. 116000 has a clean sunray finish, but the small differences in the markers keep it from feeling plain. The double batons at three, six and nine are wider than the rest, and the minute scale sits close to the edge. I like how the smooth bezel leaves the dial open. At 36 mm, this reference keeps the familiar Oyster proportions and a simple three-hand layout with no date window to interrupt it. The Oyster Perpetual name joins Rolex\u2019s waterproof Oyster case with its self-winding Perpetual rotor. Rolex patented that rotor system in 1931, and it remains the key idea behind the line. Here, the brushed steel bracelet and polished bezel give the silver dial two different surfaces to play against. The central seconds hand is thin enough to keep the face calm, and the applied markers catch the light without adding extra detail. It\u2019s a straightforward OP, and the wide 3, 6 and 9 markers are my favourite part."},"audience":null,"any_carousel_media":true,"media_type":8,"product_type":"carousel_container","id":"POLARIS_4024500431502205763"},"cursor":"AQHTAXPbkcwi0lr2YlUs2yx74W-fHb94Z-4q7ioeVHIloEmKDCAea_rTNBL-NkdB3N1VOJqdx1yY__SmwHPsroZQ_g"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","is_timeline_pinned":false,"pk":"4023775562497344175","image_versions2":{"candidates":[{"height":1440,"url":"https:\/\/scontent-sin6-2.cdninstagram.com\/v\/t39.30808-6\/857240618_1101385262536511_8973207500319429283_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=109&ig nt-sin6-2.cdninstagram.com\/v\/t39.30808-6\/857240618_1101385262536511_8973207500319429283_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=109&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=9w0Q30v9hkwQ7kNvwGR4oMa&_nc_oc=Adpwc4CzycKaQryiEV0VnG4h4jPsmo2pCbxfqLWpDurPxHR5WRduAQirXPXrWcKQ884&_nc_zt=23&_nc_ht=scontent-sin6-2.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQSEPDNc3hRe-HjbeIJ_3ZpWO9BmnBb3AV3LgwTMfRMxIg&oe=6AF4959A","seo_canonical_url":null,"caption":{"pk":"18155593777526796","text":"The blue front dial and silver reverse are what I like most on this Reverso Tribute Duoface Small Seconds, ref. Q3988481. The front has a sunray finish, a narrow rail track and long applied markers, with small seconds at six. Flip the case and the second dial gives you another time zone, plus a 24-hour display marked DAY and NIGHT. Both faces run from one hand-wound JLC calibre 854, so the extra display is built into the watch rather than an add-on. The Reverso was introduced in 1931 after polo players in India asked for a watch with a case that could turn over and protect its glass during a match. Here, the three raised lines above and below the dial keep the case tied to that familiar Reverso shape. I also like the radial grooves inside the carriage and the way the blue dial changes with the light. It\u2019s a two-face watch, but the blue side is still the one I\u2019d choose to look at."},"audience":null,"any_carousel_media":true,"media_type":8,"product_type":"carousel_container","id":"POLARIS_4023775562497344175"},"cursor":"AQHTgh6NgcZyDZfropV4q0i4pvWYx_9_Mad_CuSVRCPoR8lO6YHNEhfesdqvZ7ZgdOVYd7pT4dcv1fhH_YibEC7jXQ"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","is_timeline_pinned":false,"pk":"4022325997479784720","image_versions2":{"candidates":[{"height":1440,"url":"https:\/\/scontent-sin2-2.cdninstagram.com\/v\/t39.30808-6\/849694909_1093825026625868_58896 lnGquAbaJ3y22arOjs8HQ-gUB3H633kth16l4itjMcA&oe=6AF49C43","seo_canonical_url":null,"caption":{"pk":"18114726365272095","text":"Scale tells the whole story. Rolex Explorer ref. 114270 distills its purpose into a 36 mm Oyster case: glossy black dial, applied 3-6-9 numerals, luminous triangle and batons, and Mercedes hands. A smooth polished bezel adds formality, while brushed lug tops and the three-link Oyster bracelet preserve its field-watch character. Introduced in 2001 after ref. 14270, the 114270 retained the classic diameter but gained calibre 3130 and solid end links. Rolex launched the Explorer in 1953 following the first successful ascent of Everest, drawing on experience from Oyster Perpetual watches supplied to the expedition; the connection was built on legibility and resilience, not decoration. In these images, crisp contrast meets light surface wear across the steel, giving the watch texture without softening its clean lines. \u26f0\ufe0f I find the 114270 especially convincing as a bridge: modern enough to wear without ceremony, compact enough to keep the original Explorer idea intact."},"audience":null,"any_carousel_media":true,"media_type":8,"product_type":"carousel_container","id":"POLARIS_4020876269654763801"},"cursor":"AQHTcLgTC59ICS4v1_ozfPqjPBCkXTgfWOrTvDQjYZqjH5H2OQ9ERxFOQ1NC7NebZF8jSMqU-SkItUaMUBZ13hlHHQ"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","is_timeline_pinned":false,"pk":"4019427028512225296","image_versions2":{"candidates":[{"height":1440,"url":"https:\/\/scontent-sin6-1.cdninstagram.com\/v\/t39.30808-6\/830511428_1082791834395854_3911644022860940341_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=111&ig_cache_key=NDAxOTQyNzAwNzEyMTI5MTYwNg\u00253D\u00253D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTE1Mi5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=gtvhcCYxHcIQ7kNvwHgl4fV&_nc_oc=AdpyHK6QejUhjbws5XMABZPIB3Ji7EnbxKMGTX3iLXg8Khso9yxdXptheN4vbwlGEgg&_nc_zt=23&_nc_ht= ial, with brushed lug tops, polished sides and drilled holes for the spring bars. The black aluminium insert has a luminous pearl at zero and fine marks visible near the upper edge. Three rows of brushed Oyster links carry the line of the lugs into the bracelet. Inside the folding clasp, the steel is stamped 93150 and Z6; the outer cover bears a raised coronet."},"audience":null,"any_carousel_media":true,"media_type":8,"product_type":"carousel_container","id":"POLARIS_4017916856337691581"},"cursor":"AQHTmFn-gMNIeLP-u7VjhjXv3vRKhaxoRQsPyi9dJDPAVoUE8rUOo7XqfP5OtxeQ7QPmU8U4__g3AIj0dqbxVqVewQ"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","is_timeline_pinned":false,"pk":"4017252365673594198","image_versions2":{"candidates":[{"height":1440,"url":"https:\/\/scontent-sin6-3.cdninstagram.com\/v\/t51.82787-15\/868379416_18017375261985663_7539185334359235849_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=110&ig_cache_key=NDAxNzA5ODI3NzA0NDUxOTU3Nw\u00253D\u00253D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTE1Mi5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=6AILfT1t6NwQ7kNvwEt_G1y&_nc_oc=Adr10uX-QlwxUXlSW28DzsWvcgsUJxULt7c9DBqbTX5eHtjmqLe9Jgdi-Kr5OAARyU0&_nc_zt=23&_nc_ht=scontent-sin6-3.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQQhU4gNXFk8nKczlJhUubebFjji90I3J82h8MO-_Je4Hw&oe=6AF4723E","width":1152},{"height":900,"url":"https:\/\/scontent-sin6-3.cdninstagram.com\/v\/t51.82787-15\/868379416_18017375261985663_7539185334359235849_n.jpg?stp=dst-jpg_e35_p720x720_tt6&_nc_cat=110&ig_cache_key=NDAxNzA5ODI3NzA0NDUxOTU3Nw\u00253D\u00253D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTE1Mi5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=6AILfT1t6NwQ7kNvwEt_G1y&_nc_oc=Adr10uX-QlwxUXlSW28DzsWvcgsUJxULt7c9DBqbTX5eHtjmqLe9Jgdi-Kr5OAARyU0&_nc_zt=23&_nc_ht=scontent-sin6-3.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQQwQGfRySJEaws4lJlYbXIZgP-xUuw WMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQSyYo60LdFLdV3zZ46ctesbGIlGPDDYV5sKP5FzWXavrA&oe=6AF48980","width":150}]},"id":"POLARIS_4017098277019353212"}],"display_uri":"https:\/\/scontent-sin6-3.cdninstagram.com\/v\/t51.82787-15\/868379416_18017375261985663_7539185334359235849_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=110&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=6AILfT1t6NwQ7kNvwEt_G1y&_nc_oc=Adr10uX-QlwxUXlSW28DzsWvcgsUJxULt7c9DBqbTX5eHtjmqLe9Jgdi-Kr5OAARyU0&_nc_zt=23&_nc_ht=scontent-sin6-3.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQTIGs0Rhx32pVWAqn0xZlB_E16wuVRR9zuZRzLU-QtxNQ&oe=6AF4723E","seo_canonical_url":null,"caption":{"pk":"18358957273170874","text":"The black dial and cream plots set the tone on this Submariner Date ref. 16610. At six, the \u201cSWISS-T\u003C25\u201d line identifies a tritium dial, and the markers have a warm cast in these photos. Rolex added a date to the Submariner in 1969, and here the Cyclops over the three o\u2019clock window keeps that detail easy to read. The round plots, broad Mercedes hands and triangle at twelve are familiar, but the narrow minute track gives the dial plenty to look at without crowding it. I like the way the black bezel carries the dial colour out to the edge, with its white markers doing the contrast. The close side view shows the crown guards and the sharp teeth on the bezel, while the brushed Oyster links keep the rest plain. Inside the clasp, the number 93150 is visible. The dial also states 1000 ft = 300 m, so the date and dive scale share the face without fighting for space. The clear tritium mark is my favourite detail here."},"audience":null,"any_carousel_media":true,"media_type":8,"product_type":"carousel_container","id":"POLARIS_4017252365673594198"},"cursor":"AQHTe-xu8X3Q0QoiaNKkjzyCDiXxOAAkn2x8NOcApRyAi7FXTwVpWw5DYyovMp_I-LKNRslTJ646lyqCXL6ih2y0UQ"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":" NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQTnf9tzhmDvtQS_srF6E4MW_h0AlUKznk3jaXbRPBo8Cg&oe=6AF49374","seo_canonical_url":null,"caption":{"pk":"17963116629210404","text":"The black numbers and round dots take turns around this Nomad\u2019s pale dial. I like how the 2, 4, 8 and 10 tilt to follow its edge. The outer minute track uses small boxes, with darker marks every five minutes. Fine rings fill the small seconds dial at six. The hour hand has a coppery tone, and the darker minute hand has a blue patch near its tip. Small specks cover the dial, with darker marks around the edge. Nomad was a watch name registered by Fleurier Watch Co. in 1932. On this example, 28 is stamped inside the back and the movement is marked Swiss Made and 15 Jewels. The case has a bright, flat bezel and long, narrow lugs, with brown patches along the inner rim of the back. The orange stitching on the brown strap is a bit strong for my taste beside all that black print. I\u2019d choose a darker thread. The seconds dial leaves the whole 6 visible, which I like."},"audience":null,"any_carousel_media":true,"media_type":8,"product_type":"carousel_container","id":"POLARIS_4017252283565928135"},"cursor":"AQHTUH09UlDaFCM-IF_M56WdvSy7uteBfIM4F6am20sv160VCyU-znAwyOrUeduqQrI2OWPCQA9PDl3wfwU1iVhBkg"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","is_timeline_pinned":false,"pk":"4016527540658801941","image_versions2":{"candidates":[{"height":1440,"url":"https:\/\/scontent-sin2-1.cdninstagram.com\/v\/t39.30808-6\/851789458_1095578953117142_2089799897377461545_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=107&ig_cache_key=NDAxNjUyNzQ4ODUxNTIwNTc3MQ\u00253D\u00253D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTE1Mi5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=7sFMPQEfuW8Q7kNvwHrdXxo&_nc_oc=AdrmdxFGx9T1shu8YaQFFiXXOGZCSqygYgLFUVZO5Ee6igzg1jFsRhY4aVdCyeT2I4E&_nc_zt=23&_nc_ht=scontent-sin2-1.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7 vFKz8-mpgz07aSwcWHPftQ&oe=6AF48C78","width":240},{"height":150,"url":"https:\/\/scontent-sin11-2.cdninstagram.com\/v\/t39.30808-6\/850489517_1095578966450474_5428529725226187544_n.jpg?stp=c0.144.1152.1152a_dst-jpg_e35_s150x150_tt6&_nc_cat=101&ig_cache_key=NDAxNjUyNzQ5MjI4MTY3NjcwNQ\u00253D\u00253D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTE1Mi5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=WHIj6cs5fHcQ7kNvwEiHuNE&_nc_oc=Ado6YrXywV8WsNhI7TU4EJxxHgmr_tHqntHc_6EIqJa56FBRTVTZiNhmQCnTYHrt2tA&_nc_zt=23&_nc_ht=scontent-sin11-2.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQSXgIFRrMEVNyoYgKWI7Di1_Nh7zNJZHrndhYToX7-4HQ&oe=6AF48C78","width":150}]},"id":"POLARIS_4016527492281676705"}],"display_uri":"https:\/\/scontent-sin2-1.cdninstagram.com\/v\/t39.30808-6\/851789458_1095578953117142_2089799897377461545_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=107&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiQ0FST1VTRUxfSVRFTS5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=7sFMPQEfuW8Q7kNvwHrdXxo&_nc_oc=AdrmdxFGx9T1shu8YaQFFiXXOGZCSqygYgLFUVZO5Ee6igzg1jFsRhY4aVdCyeT2I4E&_nc_zt=23&_nc_ht=scontent-sin2-1.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQQxvdSZ61MqxCKKDNdSbyQptsEy8A6--TVIQiGXEDX5cA&oe=6AF48AE9","seo_canonical_url":null,"caption":{"pk":"17892113796457821","text":"The silver dial of this Rolex Oyster Perpetual 28 ref. 276200 has fine lines running out from the centre, so the shade changes as light crosses it. Gold-coloured hands and rectangular hour markers sit against that cool surface, with white inserts and a small crown at 12. I like the mix of warm markers and plain steel; a date window would crowd this small dial. Rolex fits the reference with its automatic calibre 2232, with a power reserve of about 55 hours. The Oyster Perpetual line traces back to the Oyster case of 1926, and this watch keeps that simple hours, minutes and seconds layout. At 28 mm, the Oystersteel case has a smooth domed bezel and short lugs that run straight into the bracelet. Its polished sides and bezel catch more light than the brushed tops. The three-link Oyster bracelet follows the case with broad, flat brushed links, a style Rolex introduced in the late 1930s. The folding clasp has a small raised crown on its brushed cover."},"audience":null,"any_carousel_media":true,"media_type":8,"product_type":"carousel_container","id":"POLARIS_4016527540658801941"},"cursor":"AQHTtxUbJDR0sA8uTY4utNApUyxDGCar3Zmn4YED7BE6UqKw7noJJPfn5SP9Z417ASU-U9ApewagpAVNW-ED3Dh1hw"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","is_timeline_pinned":false,"pk":"4016527445566095353","image_versions2":{"candidates":[{"height":1440,"url":"https:\/\/scontent-sin2-2.cdninstagram.com\/v\/t51.82787-15\/866764078_18017106422985663_6577136013760134815_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=102&ig_cache_key=NDAxNjA4MDkzMTY1NTkxOTY5NQ\u00253D\u00253D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTE1Mi5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=CSB0VVRPl7kQ7kNvwEBmaiR&_nc_oc=AdqI7enMxCIlgBIrs5iBnE4vDtyNuHHQfjin7X2GkNXq-NO7Fzfv2bzb0SvKGaAhMas&_nc_zt=23&_nc_ht=scontent-sin2-2.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQSbQMar7RYAVKtmpbKJLBzef1vNi8KrErkcfcv77vtlkQ&oe=6AF480EC","width":1152},{"height":900,"url":"https:\/\/scontent-sin2-2.cdninstagram.com\/v\/t51.82787-15\/866764078_18017106422985663_6577136013760134815_n.jpg?stp=dst-jpg_e35_p720x720_tt6&_nc_cat=102&ig_cache_key=NDAxNjA4MDkzMTY1NTkxOTY5NQ\u00253D\u00253D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTE1Mi5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=CSB0VVRPl7kQ7kNvwEBmaiR&_nc_oc=AdqI7enMxCIlgBIrs5iBnE4vDtyNuHHQfjin7X2GkNXq-NO7Fzfv2bzb0SvKGaAhMas&_nc_zt=23&_nc_ht=scontent-sin2-2.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQRBSCfrXXboAC7sykQK90yFSqG1VdtE2SHGZTDxc6D3dQ&oe=6AF480EC","width":720},{"height":800,"url":"htt old bezel and the small gold links in the steel bracelet. I like that the two-tone detail is carried through the whole watch, with brushed steel still taking up most of the bracelet. The eight bright bezel screws break up the gold ring, and the clasp carries an AP plate in gold. The calendar shows the day, date and moon phase, with no month or leap-year display. The Royal Oak started in 1972, and AP added a moon phase to its day-date model in 1984 with the 25594. The brand archive lists automatic calibre 2124\/2825 for this reference. The moon window at six is still the detail I notice first."},"audience":null,"any_carousel_media":true,"media_type":8,"product_type":"carousel_container","id":"POLARIS_4016527445566095353"},"cursor":"AQHTjkTB-ULmkFA4S2Rj0n1FcbmCkWrhBww_iZdNBM14FZlhDiYlweRt6U-RhbxEjYAio8FK70HO0FTsfAPhn8Q5bw"},{"node":{"__typename":"XIGPolarisCarouselMedia","__isXIGPolarisMedia":"XIGPolarisCarouselMedia","is_timeline_pinned":false,"pk":"4015802984306615499","image_versions2":{"candidates":[{"height":1440,"url":"https:\/\/scontent-sin11-2.cdninstagram.com\/v\/t39.30808-6\/858744788_1101382279203476_1703345769966429606_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=101&ig_cache_key=NDAxNTgwMjk2NzU0NjE1ODk3MQ\u00253D\u00253D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTE1Mi5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=iIK5cHZLeg8Q7kNvwFcIP8k&_nc_oc=AdoYUOurfeUD_VmN9Nfwylaz06eXSpffOd5MHjtpYqSgsLtzas-SHbgybyQrsoVRyqw&_nc_zt=23&_nc_ht=scontent-sin11-2.cdninstagram.com&_nc_gid=ddWMiAJT1NcA95vz6gz_nA&_nc_ss=7d60f&oh=00_AQRcBPV7eIAVyeqDNDYNStNVS5XSXGGjU_Q4fPeWvwkw6Q&oe=6AF48D66","width":1152},{"height":900,"url":"https:\/\/scontent-sin11-2.cdninstagram.com\/v\/t39.30808-6\/858744788_1101382279203476_1703345769966429606_n.jpg?stp=dst-jpg_e35_p720x720_tt6&_nc_cat=101&ig_cache_key=NDAxNTgwMjk2NzU0NjE1ODk3MQ\u00253D\u00253D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTE1Mi5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc
